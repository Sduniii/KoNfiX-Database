services:
  - type: web
    name: konfix-database
    runtime: python
    disk:
      name: konfix-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/seed_sample_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_NAME
        value: KoNfiX-Database
      - key: DATABASE_URL
        value: sqlite:////var/data/konfix_database.db
      - key: STORAGE_DIR
        value: /var/data/catalog_files
